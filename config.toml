[ollama]
model = "llama3.2"
timeout = 15

[grading]
# Grading thresholds
levenshtein_perfect_threshold = 0.98
levenshtein_good_threshold = 0.85

# Require LLM confirmation for borderline cases
use_llm_on_borderline = true

[parent]
# Parent routes remain available for first-run setup until a PIN is configured.
pin_hash = ""
# Optional: minutes to keep the parent session cookie valid.
session_minutes = 30

[stt]
# Local speech-to-text fallback. Requires ffmpeg and a whisper backend.
# provider = "auto" | "faster-whisper" | "whisper"
provider = "auto"
model = "base"
language = "en"
device = "cpu"
compute_type = "int8"
normalize_audio = true
vad_filter = true
no_speech_threshold = 0.6
log_prob_threshold = -1.0
fallback_no_speech_threshold = 0.9
fallback_log_prob_threshold = -5.0

[uploads]
# Maximum request payload sizes for user-uploaded files.
backup_restore_max_bytes = 20971520
stt_audio_max_bytes = 26214400
cards_txt_max_bytes = 5242880
