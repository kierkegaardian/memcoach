name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run -- make check PYTHON=python

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - run: |
          cd android-native
          ./gradlew :core-scheduling:test :core-grading:test :app:testDebugUnitTest :app:assembleDebug --no-daemon
          ./gradlew -p ../android-wrapper :app:assembleDebug --no-daemon
