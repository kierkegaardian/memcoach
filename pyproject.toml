[project]
name = "memcoach"
version = "0.1.0"
description = "Local-first FastAPI memorization app."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "httpx",
  "jinja2",
  "python-dotenv",
  "python-Levenshtein",
  "python-multipart",
  "uvicorn[standard]",
]

[project.optional-dependencies]
stt = ["faster-whisper"]

[dependency-groups]
dev = [
  "pytest",
  "ruff>=0.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
include = ["db", "db.*", "models", "models.*", "routes", "routes.*", "utils", "utils.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
